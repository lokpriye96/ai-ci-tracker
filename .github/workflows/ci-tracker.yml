# Runs the CI tracker on GitHub: collect news -> LLM extraction (Gemini) ->
# validation -> rebuild Excel, battle cards and dashboard -> commit.
# Needs one repository secret: GEMINI_API_KEY (Settings > Secrets and variables > Actions).
name: CI tracker refresh

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        default: "14"
  push:
    branches: [main]
    paths: ["src/**", "prompts/**", "run_pipeline.py", ".github/workflows/ci-tracker.yml"]
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC (08:47 IST)

permissions:
  contents: write   # commit refreshed data back to the repo

concurrency:
  group: ci-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline)
        run: pytest -q

      - name: No API key yet
        if: env.HAS_KEY != 'true'
        run: echo "GEMINI_API_KEY secret not set - skipping the live LLM run."

      - name: Collect, extract and validate
        if: env.HAS_KEY == 'true'
        env:
          CI_LLM_PROVIDER: gemini
          CI_LLM_DELAY: "5"
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_pipeline.py --days "${{ github.event.inputs.days || '14' }}"

      - name: Rebuild outputs
        if: env.HAS_KEY == 'true'
        run: python build_outputs.py

      - name: Commit refreshed data
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "ci-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
